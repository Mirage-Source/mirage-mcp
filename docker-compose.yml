services:
  mirage-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      MCP_TRANSPORT: streamable-http
      # 0.0.0.0 inside the container's own network namespace -- the host
      # port publish below is what actually decides public reachability,
      # same split mirage-crawl uses for CRAWL_HOST/CRAWL_PORT.
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8765"
      MCP_MAX_REQUEST_BODY_SIZE: "65536"
      GEO_ASN_CSV: /data/geo/dbip-asn-lite.csv
      GEO_COUNTRY_CSV: /data/geo/dbip-country-lite.csv
    volumes:
      - mcp_data:/app/data
      # Reuses mirage-core's already-downloaded DB-IP Lite snapshots
      # (see mirage-core/data/geo/SOURCE.md) instead of duplicating a 60MB
      # licensed dataset -- both sensors run on the same box.
      - ${GEO_DATA_DIR:-/opt/mirage/mirage-core/data/geo}:/data/geo:ro
    ports:
      # Loopback only: public reachability goes through the host's
      # Cloudflare Tunnel (cloudflared -> http://localhost:8765), not a
      # directly-published port, so the VPS's real IP never appears in
      # DNS/CT logs for mcp.vtyagi.dev.
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  mcp_data:
